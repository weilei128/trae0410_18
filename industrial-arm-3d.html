<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工业机械臂3D交互可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.95);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            min-width: 280px;
            max-width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 100, 150, 0.3);
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        #control-panel.collapsed {
            transform: translateX(calc(100% + 10px));
        }
        #toggle-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(100, 100, 150, 0.3);
            border-radius: 8px;
            color: #4fc3f7;
            font-size: 20px;
            cursor: pointer;
            z-index: 99;
            display: none;
        }
        #control-panel.collapsed + #toggle-panel {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #control-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4fc3f7;
            border-bottom: 2px solid #4fc3f7;
            padding-bottom: 10px;
        }
        .control-section {
            margin-bottom: 20px;
        }
        .control-section h3 {
            font-size: 14px;
            color: #81d4fa;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-section h3::before {
            content: '';
            width: 4px;
            height: 14px;
            background: #4fc3f7;
            border-radius: 2px;
        }
        .slider-group {
            margin-bottom: 12px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: #b0bec5;
        }
        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #1e3a5f, #4fc3f7);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #4fc3f7;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .slider-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #4fc3f7;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 70px;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s ease;
            background: linear-gradient(135deg, #1e3a5f, #2d4a6f);
            color: #fff;
            border: 1px solid rgba(79, 195, 247, 0.3);
            font-family: inherit;
        }
        .btn:hover {
            background: linear-gradient(135deg, #2d4a6f, #3d5a7f);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 195, 247, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn.active {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #000;
        }
        .btn.action-btn {
            background: linear-gradient(135deg, #2e7d32, #43a047);
            border-color: rgba(76, 175, 80, 0.5);
        }
        .btn.action-btn:hover {
            background: linear-gradient(135deg, #388e3c, #4caf50);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        .btn.action-btn.running {
            background: linear-gradient(135deg, #f57c00, #ff9800);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        #info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            color: #b0bec5;
            font-size: 12px;
            border: 1px solid rgba(100, 100, 150, 0.3);
            z-index: 100;
            max-width: 280px;
        }
        #info-panel p {
            margin: 5px 0;
        }
        #info-panel span {
            color: #4fc3f7;
        }
        .joint-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .joint-0 { background: #ff6b6b; }
        .joint-1 { background: #ffd93d; }
        .joint-2 { background: #6bcb77; }
        .joint-3 { background: #4d96ff; }
        .joint-4 { background: #9b59b6; }
        .joint-5 { background: #e74c3c; }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        #loading h1 {
            color: #4fc3f7;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(79, 195, 247, 0.2);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loading-progress {
            margin-top: 20px;
            color: #b0bec5;
            font-size: 14px;
        }
        #performance-stats {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            color: #4fc3f7;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid rgba(100, 100, 150, 0.3);
            z-index: 100;
        }
        #performance-stats .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        #performance-stats .warning {
            color: #ff9800;
        }
        #performance-stats .good {
            color: #4caf50;
        }
        #highlight-info {
            position: fixed;
            top: 80px;
            left: 20px;
            background: rgba(20, 20, 40, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            border: 2px solid #4fc3f7;
            z-index: 100;
            display: none;
            max-width: 300px;
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.3);
        }
        #highlight-info h4 {
            color: #4fc3f7;
            margin-bottom: 8px;
            font-size: 15px;
        }
        #highlight-info p {
            color: #b0bec5;
            margin: 4px 0;
            line-height: 1.5;
        }
        #highlight-info .spec {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(100, 100, 150, 0.2);
        }
        #highlight-info .spec-label {
            color: #81d4fa;
        }
        #highlight-info .spec-value {
            color: #fff;
        }
        .action-status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 40, 0.95);
            padding: 20px 40px;
            border-radius: 12px;
            color: #4fc3f7;
            font-size: 18px;
            border: 2px solid #4fc3f7;
            z-index: 200;
            display: none;
            text-align: center;
        }
        .action-status .progress-bar {
            width: 200px;
            height: 6px;
            background: rgba(79, 195, 247, 0.2);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }
        .action-status .progress-fill {
            height: 100%;
            background: #4fc3f7;
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        @media (max-width: 768px) {
            #control-panel {
                top: auto;
                bottom: 0;
                right: 0;
                left: 0;
                max-width: 100%;
                max-height: 50vh;
                border-radius: 12px 12px 0 0;
            }
            #control-panel.collapsed {
                transform: translateY(calc(100% + 10px));
            }
            #toggle-panel {
                top: auto;
                bottom: 20px;
                right: 20px;
            }
            #control-panel.collapsed + #toggle-panel {
                display: flex;
            }
            #info-panel {
                display: none;
            }
            #performance-stats {
                font-size: 10px;
                padding: 8px 10px;
            }
            .btn {
                padding: 8px 10px;
                font-size: 11px;
            }
        }
        @media (max-width: 480px) {
            #control-panel {
                padding: 15px;
            }
            #control-panel h2 {
                font-size: 16px;
            }
            .control-section h3 {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>工业机械臂3D可视化</h1>
        <div class="loader"></div>
        <p id="loading-progress">正在加载场景资源...</p>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="performance-stats">
        <div class="stat-row">
            <span>FPS: <span id="fps" class="good">0</span></span>
            <span>延迟: <span id="latency" class="good">0</span>ms</span>
        </div>
        <div class="stat-row">
            <span>三角面: <span id="triangles">0</span></span>
            <span>绘制: <span id="drawcalls">0</span></span>
        </div>
    </div>
    
    <div id="highlight-info">
        <h4 id="highlight-title">部件名称</h4>
        <div id="highlight-details"></div>
    </div>
    
    <div class="action-status" id="action-status">
        <div id="action-name">执行动作中...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="action-progress"></div>
        </div>
    </div>
    
    <div id="control-panel">
        <h2>控制面板</h2>
        
        <div class="control-section">
            <h3>预设动作一键触发</h3>
            <div class="btn-group">
                <button class="btn action-btn" id="btn-welding" onclick="executeAction('welding')">焊接</button>
                <button class="btn action-btn" id="btn-spray" onclick="executeAction('spray')">喷涂</button>
                <button class="btn action-btn" id="btn-assembly" onclick="executeAction('assembly')">装配</button>
                <button class="btn action-btn" id="btn-transport" onclick="executeAction('transport')">搬运</button>
            </div>
            <div class="btn-group" style="margin-top: 8px;">
                <button class="btn action-btn" id="btn-inspect" onclick="executeAction('inspect')">检测</button>
                <button class="btn action-btn" id="btn-pickplace" onclick="executeAction('pickplace')">拾放</button>
                <button class="btn" onclick="stopAction()">停止</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>机械臂关节控制</h3>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-0"></span>基座旋转</span>
                    <span id="joint0-value">0°</span>
                </label>
                <input type="range" id="joint0" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-1"></span>肩部关节</span>
                    <span id="joint1-value">0°</span>
                </label>
                <input type="range" id="joint1" min="-90" max="90" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-2"></span>肘部关节</span>
                    <span id="joint2-value">0°</span>
                </label>
                <input type="range" id="joint2" min="-135" max="135" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-3"></span>腕部旋转</span>
                    <span id="joint3-value">0°</span>
                </label>
                <input type="range" id="joint3" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-4"></span>腕部俯仰</span>
                    <span id="joint4-value">0°</span>
                </label>
                <input type="range" id="joint4" min="-90" max="90" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-5"></span>夹爪开合</span>
                    <span id="joint5-value">50%</span>
                </label>
                <input type="range" id="joint5" min="0" max="100" value="50">
            </div>
        </div>
        
        <div class="control-section">
            <h3>灯光控制</h3>
            <div class="slider-group">
                <label>
                    <span>主灯光强度</span>
                    <span id="main-light-value">1.0</span>
                </label>
                <input type="range" id="main-light" min="0" max="200" value="100">
            </div>
            <div class="slider-group">
                <label>
                    <span>环境光强度</span>
                    <span id="ambient-light-value">0.4</span>
                </label>
                <input type="range" id="ambient-light" min="0" max="100" value="40">
            </div>
            <div class="slider-group">
                <label>
                    <span>聚光灯强度</span>
                    <span id="spot-light-value">1.5</span>
                </label>
                <input type="range" id="spot-light" min="0" max="300" value="150">
            </div>
        </div>
        
        <div class="control-section">
            <h3>预设视角</h3>
            <div class="btn-group">
                <button class="btn" onclick="setView('front')">正面</button>
                <button class="btn" onclick="setView('side')">侧面</button>
                <button class="btn" onclick="setView('top')">俯视</button>
                <button class="btn" onclick="setView('iso')">等距</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>预设姿态</h3>
            <div class="btn-group">
                <button class="btn" onclick="setPose('home')">初始</button>
                <button class="btn" onclick="setPose('work')">工作</button>
                <button class="btn" onclick="setPose('pick')">拾取</button>
                <button class="btn" onclick="setPose('fold')">折叠</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>显示选项</h3>
            <div class="btn-group">
                <button class="btn active" id="btn-grid" onclick="toggleGrid()">网格</button>
                <button class="btn" id="btn-wireframe" onclick="toggleWireframe()">线框</button>
                <button class="btn active" id="btn-shadows" onclick="toggleShadows()">阴影</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>高亮显示</h3>
            <div class="btn-group">
                <button class="btn" id="btn-highlight-all" onclick="highlightAllParts()">全部部件</button>
                <button class="btn" onclick="clearHighlight()">清除高亮</button>
            </div>
        </div>
    </div>
    
    <button id="toggle-panel" onclick="togglePanel()">☰</button>
    
    <div id="info-panel">
        <p><strong>操作提示：</strong></p>
        <p>鼠标左键拖拽：旋转视角</p>
        <p>鼠标右键拖拽：平移视角</p>
        <p>滚轮：缩放视角</p>
        <p>点击部件：高亮显示信息</p>
        <p>拖拽关节球：控制关节</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DragControls } from 'three/addons/controls/DragControls.js';
        
        let scene, camera, renderer, controls, dragControls;
        let robotArm = {};
        let draggableObjects = [];
        let clickableObjects = [];
        let showGrid = true;
        let showWireframe = false;
        let showShadows = true;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        let lastInteractionTime = 0;
        let interactionLatency = 0;
        let currentAction = null;
        let actionAnimationId = null;
        let highlightedObject = null;
        let originalMaterials = new Map();
        let raycaster, mouse;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        const jointLimits = [
            { min: -Math.PI, max: Math.PI },
            { min: -Math.PI / 2, max: Math.PI / 2 },
            { min: -Math.PI * 0.75, max: Math.PI * 0.75 },
            { min: -Math.PI, max: Math.PI },
            { min: -Math.PI / 2, max: Math.PI / 2 },
            { min: 0, max: 1 }
        ];
        
        const partInfo = {
            base: { name: '基座', desc: '机械臂的固定底座，提供稳定的支撑基础', specs: { '材质': '铸铁', '承重': '500kg', '直径': '600mm' } },
            shoulder: { name: '肩部关节', desc: '连接基座与大臂的主要旋转关节', specs: { '材质': '合金钢', '扭矩': '500Nm', '旋转角度': '±90°' } },
            upperArm: { name: '大臂', desc: '机械臂的主要承力部件', specs: { '材质': '铝合金', '长度': '800mm', '重量': '15kg' } },
            elbow: { name: '肘部关节', desc: '连接大臂与小臂的弯曲关节', specs: { '材质': '合金钢', '扭矩': '300Nm', '旋转角度': '±135°' } },
            forearm: { name: '小臂', desc: '提供延伸距离的次要臂段', specs: { '材质': '铝合金', '长度': '600mm', '重量': '8kg' } },
            wristRotate: { name: '腕部旋转', desc: '末端执行器的旋转关节', specs: { '材质': '不锈钢', '扭矩': '100Nm', '旋转角度': '±180°' } },
            wristPitch: { name: '腕部俯仰', desc: '末端执行器的俯仰调节关节', specs: { '材质': '不锈钢', '扭矩': '80Nm', '旋转角度': '±90°' } },
            gripper: { name: '夹爪', desc: '末端执行器，用于抓取工件', specs: { '材质': '工具钢', '夹持力': '200N', '开合范围': '0-100mm' } },
            joint0: { name: '基座旋转关节', desc: '控制机械臂整体旋转', specs: { '类型': '伺服电机', '功率': '2kW', '精度': '0.01°' } },
            joint1: { name: '肩部旋转关节', desc: '控制大臂俯仰运动', specs: { '类型': '伺服电机', '功率': '1.5kW', '精度': '0.01°' } },
            joint2: { name: '肘部旋转关节', desc: '控制小臂俯仰运动', specs: { '类型': '伺服电机', '功率': '1kW', '精度': '0.01°' } },
            joint3: { name: '腕部旋转关节', desc: '控制末端旋转', specs: { '类型': '伺服电机', '功率': '0.5kW', '精度': '0.02°' } },
            joint4: { name: '腕部俯仰关节', desc: '控制末端俯仰', specs: { '类型': '伺服电机', '功率': '0.3kW', '精度': '0.02°' } }
        };
        
        const presetActions = {
            welding: {
                name: '焊接作业',
                sequence: [
                    { joints: [0, 30, 45, -30, 0, 80], duration: 1000 },
                    { joints: [45, 30, 45, -30, 15, 20], duration: 800 },
                    { joints: [90, 25, 50, -25, 10, 20], duration: 800 },
                    { joints: [135, 30, 45, -30, 5, 20], duration: 800 },
                    { joints: [180, 35, 40, -35, 0, 20], duration: 800 },
                    { joints: [135, 30, 45, -30, 5, 20], duration: 800 },
                    { joints: [90, 25, 50, -25, 10, 20], duration: 800 },
                    { joints: [45, 30, 45, -30, 15, 20], duration: 800 },
                    { joints: [0, 30, 45, -30, 0, 80], duration: 1000 }
                ],
                loop: true
            },
            spray: {
                name: '喷涂作业',
                sequence: [
                    { joints: [-60, 20, 30, 0, -20, 100], duration: 600 },
                    { joints: [-30, 25, 35, 15, -15, 100], duration: 500 },
                    { joints: [0, 20, 30, 0, -20, 100], duration: 500 },
                    { joints: [30, 25, 35, -15, -15, 100], duration: 500 },
                    { joints: [60, 20, 30, 0, -20, 100], duration: 500 },
                    { joints: [30, 25, 35, 15, -15, 100], duration: 500 },
                    { joints: [0, 20, 30, 0, -20, 100], duration: 500 },
                    { joints: [-30, 25, 35, -15, -15, 100], duration: 500 }
                ],
                loop: true
            },
            assembly: {
                name: '装配作业',

        function init() {
            const progressEl = document.getElementById('loading-progress');
            progressEl.textContent = '初始化场景...';
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 20, 80);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 6, 8);

            controls.minDistance = 3;
            controls.maxDistance = 30;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.target.set(0, 2, 0);
            controls.touches = {
                ONE: THREE.TOUCH.ROTATE,

            };
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            progressEl.textContent = '创建灯光...';
            setupLights();
            
            progressEl.textContent = '创建车间场景...';

        function createJointSphere(color, radius) {
            const geometry = new THREE.SphereGeometry(radius, 16, 16);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.5,
                emissive: color,
                emissiveIntensity: 0.2
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.castShadow = true;
            return sphere;
        }
        
        function setupDragControls() {
            dragControls = new DragControls(draggableObjects, camera, renderer.domElement);
            
            dragControls.addEventListener('dragstart', function(event) {
                controls.enabled = false;
                lastInteractionTime = performance.now();
                highlightObject(event.object);
            });
            
            dragControls.addEventListener('drag', function(event) {
                const obj = event.object;
                const jointIndex = obj.userData.jointIndex;
                const currentTime = performance.now();
                interactionLatency = currentTime - lastInteractionTime;
                lastInteractionTime = currentTime;
                
                if (jointIndex !== undefined) {
                    const worldPos = new THREE.Vector3();
                    obj.getWorldPosition(worldPos);
                    
                    switch(jointIndex) {
                        case 0:
                            const angle0 = Math.atan2(worldPos.x, worldPos.z);
                            robotArm.base.rotation.y = THREE.MathUtils.clamp(angle0, jointLimits[0].min, jointLimits[0].max);
                            updateSlider(0, robotArm.base.rotation.y);
                            break;
                        case 1:
                            const angle1 = Math.atan2(worldPos.z, worldPos.y - 1.1);
                            robotArm.shoulder.rotation.z = THREE.MathUtils.clamp(-angle1, jointLimits[1].min, jointLimits[1].max);
                            updateSlider(1, robotArm.shoulder.rotation.z);
                            break;
                        case 2:
                            const angle2 = Math.atan2(worldPos.z, worldPos.y - 2.4);
                            robotArm.elbow.rotation.z = THREE.MathUtils.clamp(-angle2, jointLimits[2].min, jointLimits[2].max);
                            updateSlider(2, robotArm.elbow.rotation.z);
                            break;
                        case 3:
                            const angle3 = Math.atan2(worldPos.x, worldPos.z);
                            robotArm.wristRotate.rotation.y = THREE.MathUtils.clamp(angle3, jointLimits[3].min, jointLimits[3].max);
                            updateSlider(3, robotArm.wristRotate.rotation.y);
                            break;
                        case 4:
                            const angle4 = Math.atan2(worldPos.z, worldPos.y - 4.0);
                            robotArm.wristPitch.rotation.z = THREE.MathUtils.clamp(-angle4, jointLimits[4].min, jointLimits[4].max);
                            updateSlider(4, robotArm.wristPitch.rotation.z);
                            break;
                    }
                }
            });
            
            dragControls.addEventListener('dragend', function(event) {
                controls.enabled = true;
            });
            
            dragControls.addEventListener('hoveron', function(event) {
                document.body.style.cursor = 'grab';
                highlightObject(event.object);
            });
            
            dragControls.addEventListener('hoveroff', function(event) {
                document.body.style.cursor = 'auto';
                if (highlightedObject === event.object) {
                    clearHighlight();
                }
            });
        }
        
        function setupClickDetection() {
            renderer.domElement.addEventListener('click', onCanvasClick);
            renderer.domElement.addEventListener('touchend', onCanvasTouch);
        }
        
        function onCanvasClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, false);
            
            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;
                highlightObject(clickedObject);
                showPartInfo(clickedObject.userData.partName);
            }
        }
        
        function onCanvasTouch(event) {
            if (event.changedTouches.length === 1) {
                const touch = event.changedTouches[0];
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(clickableObjects, false);
                
                if (intersects.length > 0) {
                    const clickedObject = intersects[0].object;
                    highlightObject(clickedObject);
                    showPartInfo(clickedObject.userData.partName);
                }
            }
        }
        
        function highlightObject(obj) {
            clearHighlight();
            
            highlightedObject = obj;
            originalMaterials.set(obj, obj.material.clone());
            
            const highlightMat = obj.material.clone();
            highlightMat.emissive = new THREE.Color(0x4fc3f7);
            highlightMat.emissiveIntensity = 0.5;
            obj.material = highlightMat;
            
            showPartInfo(obj.userData.partName);
        }
        
        function clearHighlight() {
            if (highlightedObject && originalMaterials.has(highlightedObject)) {
                highlightedObject.material = originalMaterials.get(highlightedObject);
                originalMaterials.delete(highlightedObject);
            }
            highlightedObject = null;
            document.getElementById('highlight-info').style.display = 'none';
        }
        
        window.clearHighlight = clearHighlight;
        
        function showPartInfo(partName) {
            if (!partName || !partInfo[partName]) return;
            
            const info = partInfo[partName];
            const infoPanel = document.getElementById('highlight-info');
            const titleEl = document.getElementById('highlight-title');
            const detailsEl = document.getElementById('highlight-details');
            
            titleEl.textContent = info.name;
            
            let html = `<p>${info.desc}</p>`;
            if (info.specs) {
                html += '<div style="margin-top: 10px;">';
                for (const [key, value] of Object.entries(info.specs)) {
                    html += `<div class="spec"><span class="spec-label">${key}</span><span class="spec-value">${value}</span></div>`;
                }
                html += '</div>';
            }
            
            detailsEl.innerHTML = html;
            infoPanel.style.display = 'block';
        }
        
        window.highlightAllParts = function() {
            clickableObjects.forEach(obj => {
                if (!originalMaterials.has(obj)) {
                    originalMaterials.set(obj, obj.material.clone());
                    const highlightMat = obj.material.clone();
                    highlightMat.emissive = new THREE.Color(0x4fc3f7);
                    highlightMat.emissiveIntensity = 0.3;
                    obj.material = highlightMat;
                }
            });
            document.getElementById('btn-highlight-all').classList.add('active');
        };
        
        function updateSlider(jointIndex, radians) {
            const slider = document.getElementById('joint' + jointIndex);
            const valueSpan = document.getElementById('joint' + jointIndex + '-value');
            
            if (jointIndex < 5) {
                const degrees = THREE.MathUtils.radToDeg(radians);
                slider.value = degrees;
                valueSpan.textContent = degrees.toFixed(0) + '°';
            } else {
                const percent = (radians / jointLimits[5].max) * 100;
                slider.value = percent;
                valueSpan.textContent = percent.toFixed(0) + '%';
            }
        }
        
        function setupEventListeners() {
            for (let i = 0; i < 5; i++) {
                const slider = document.getElementById('joint' + i);
                slider.addEventListener('input', function() {
                    const degrees = parseFloat(this.value);
                    const radians = THREE.MathUtils.degToRad(degrees);
                    const startTime = performance.now();
                    
                    switch(i) {
                        case 0: robotArm.base.rotation.y = radians; break;
                        case 1: robotArm.shoulder.rotation.z = radians; break;
                        case 2: robotArm.elbow.rotation.z = radians; break;
                        case 3: robotArm.wristRotate.rotation.y = radians; break;
                        case 4: robotArm.wristPitch.rotation.z = radians; break;
                    }
                    
                    interactionLatency = performance.now() - startTime;
                    document.getElementById('joint' + i + '-value').textContent = degrees.toFixed(0) + '°';
                });
            }
            
            document.getElementById('joint5').addEventListener('input', function() {
                const percent = parseFloat(this.value);
                const openAmount = percent / 100;
                const startTime = performance.now();
                
                robotArm.gripperLeft.position.x = -0.08 - openAmount * 0.08;
                robotArm.gripperRight.position.x = 0.08 + openAmount * 0.08;
                
                interactionLatency = performance.now() - startTime;
                document.getElementById('joint5-value').textContent = percent.toFixed(0) + '%';
            });
            
            document.getElementById('main-light').addEventListener('input', function() {
                const value = parseFloat(this.value) / 100;
                const light = scene.getObjectByName('mainLight');
                if (light) light.intensity = value;
                document.getElementById('main-light-value').textContent = value.toFixed(1);
            });
            
            document.getElementById('ambient-light').addEventListener('input', function() {
                const value = parseFloat(this.value) / 100;
                const light = scene.getObjectByName('ambientLight');
                if (light) light.intensity = value;
                document.getElementById('ambient-light-value').textContent = value.toFixed(1);
            });
            
            document.getElementById('spot-light').addEventListener('input', function() {
                const value = parseFloat(this.value) / 100;
                const light = scene.getObjectByName('spotLight');
                if (light) light.intensity = value;
                document.getElementById('spot-light-value').textContent = value.toFixed(1);
            });
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.togglePanel = function() {
            const panel = document.getElementById('control-panel');
            panel.classList.toggle('collapsed');
        };
        
        window.setView = function(view) {
            const duration = 500;
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            let endPos, endTarget;
            
            switch(view) {
                case 'front':
                    endPos = new THREE.Vector3(0, 4, 12);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
                case 'side':
                    endPos = new THREE.Vector3(12, 4, 0);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
                case 'top':
                    endPos = new THREE.Vector3(0, 15, 0.1);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
                case 'iso':
                    endPos = new THREE.Vector3(8, 6, 8);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
            }
            
            const startTime = performance.now();
            
            function animateCamera() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                
                camera.position.lerpVectors(startPos, endPos, eased);
                controls.target.lerpVectors(startTarget, endTarget, eased);
                
                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            
            animateCamera();
        };
        
        window.setPose = function(pose) {
            stopAction();
            
            const poses = {
                home: [0, 0, 0, 0, 0, 50],
                work: [45, 30, -45, 0, 20, 30],
                pick: [-30, 45, 60, 90, -30, 100],
                fold: [0, -80, 120, 0, 80, 100]
            };
            
            const targetPose = poses[pose];
            if (!targetPose) return;
            
            const sliders = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('joint' + i));
            const startValues = sliders.map(s => parseFloat(s.value));
            const duration = 800;
            const startTime = performance.now();
            
            function animatePose() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                
                sliders.forEach((slider, i) => {
                    const newValue = startValues[i] + (targetPose[i] - startValues[i]) * eased;
                    slider.value = newValue;
                    slider.dispatchEvent(new Event('input'));
                });
                
                if (progress < 1) {
                    requestAnimationFrame(animatePose);
                }
            }
            
            animatePose();
        };
        
        window.executeAction = function(actionName) {
            const action = presetActions[actionName];
            if (!action) return;
            
            stopAction();
            currentAction = actionName;
            
            const btn = document.getElementById('btn-' + actionName);
            if (btn) btn.classList.add('running');
            
            const statusEl = document.getElementById('action-status');
            const nameEl = document.getElementById('action-name');
            const progressEl = document.getElementById('action-progress');
            
            nameEl.textContent = action.name;
            statusEl.style.display = 'block';
            
            let sequenceIndex = 0;
            let stepProgress = 0;
            const sliders = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('joint' + i));
            
            function runAction() {
                if (!currentAction) return;
                
                const currentStep = action.sequence[sequenceIndex];
                const startValues = sliders.map(s => parseFloat(s.value));
                const stepStart = performance.now();
                
                function animateStep() {
                    if (!currentAction) return;
                    
                    const elapsed = performance.now() - stepStart;
                    stepProgress = Math.min(elapsed / currentStep.duration, 1);
                    const eased = 1 - Math.pow(1 - stepProgress, 3);
                    
                    sliders.forEach((slider, i) => {
                        const newValue = startValues[i] + (currentStep.joints[i] - startValues[i]) * eased;
                        slider.value = newValue;
                        slider.dispatchEvent(new Event('input'));
                    });
                    
                    const totalProgress = ((sequenceIndex + stepProgress) / action.sequence.length) * 100;
                    progressEl.style.width = totalProgress + '%';
                    
                    if (stepProgress < 1) {
                        actionAnimationId = requestAnimationFrame(animateStep);
                    } else {
                        sequenceIndex++;
                        if (sequenceIndex >= action.sequence.length) {
                            if (action.loop) {
                                sequenceIndex = 0;
                            } else {
                                stopAction();
                                return;
                            }
                        }
                        actionAnimationId = requestAnimationFrame(runAction);
                    }
                }
                
                animateStep();
            }
            
            runAction();
        };
        
        window.stopAction = function() {
            currentAction = null;
            if (actionAnimationId) {
                cancelAnimationFrame(actionAnimationId);
                actionAnimationId = null;
            }
            
            document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('running'));
            document.getElementById('action-status').style.display = 'none';
        };
        
        window.toggleGrid = function() {
            showGrid = !showGrid;
            const grid = scene.getObjectByName('gridHelper');
            if (grid) grid.visible = showGrid;
            document.getElementById('btn-grid').classList.toggle('active', showGrid);
        };
        
        window.toggleWireframe = function() {
            showWireframe = !showWireframe;
            scene.traverse(function(obj) {
                if (obj.isMesh && obj.material) {
                    obj.material.wireframe = showWireframe;
                }
            });
            document.getElementById('btn-wireframe').classList.toggle('active', showWireframe);
        };
        
        window.toggleShadows = function() {
            showShadows = !showShadows;
            renderer.shadowMap.enabled = showShadows;
            scene.traverse(function(obj) {
                if (obj.isMesh) {
                    obj.castShadow = showShadows;
                    obj.receiveShadow = showShadows;
                }
            });
            document.getElementById('btn-shadows').classList.toggle('active', showShadows);
        };
        
        document.getElementById('btn-grid').classList.add('active');
        document.getElementById('btn-shadows').classList.add('active');
        
        function animate() {
            requestAnimationFrame(animate);
            
            const currentTime = performance.now();
            frameCount++;
            
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                
                const fpsEl = document.getElementById('fps');
                const latencyEl = document.getElementById('latency');
                
                fpsEl.textContent = fps;
                latencyEl.textContent = interactionLatency.toFixed(1);
                
                fpsEl.className = fps >= 50 ? 'good' : (fps >= 30 ? 'warning' : 'error');
                latencyEl.className = interactionLatency <= 30 ? 'good' : (interactionLatency <= 50 ? 'warning' : 'error');
                
                document.getElementById('triangles').textContent = renderer.info.render.triangles;
                document.getElementById('drawcalls').textContent = renderer.info.render.calls;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
