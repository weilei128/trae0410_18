<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业机械臂3D交互可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.95);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            min-width: 280px;
            max-width: 95vw;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 100, 150, 0.3);
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        @media (max-width: 768px) {
            #control-panel {
                top: auto;
                bottom: 10px;
                right: 10px;
                left: 10px;
                min-width: auto;
                max-height: 50vh;
            }
        }
        .highlight-outline {
            position: absolute;
            pointer-events: none;
            border: 3px solid #4fc3f7;
            border-radius: 8px;
            animation: highlightPulse 1s ease-in-out infinite;
            z-index: 1000;
        }
        @keyframes highlightPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #4fc3f7; }
            50% { opacity: 0.7; box-shadow: 0 0 20px #4fc3f7, 0 0 30px #4fc3f7; }
        }
        #part-info {
            position: fixed;
            background: rgba(20, 20, 40, 0.95);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            border: 2px solid #4fc3f7;
            display: none;
            z-index: 1000;
            max-width: 250px;
            pointer-events: none;
        }
        #part-info h4 {
            color: #4fc3f7;
            margin-bottom: 8px;
            font-size: 14px;
        }
        #part-info p {
            font-size: 12px;
            color: #b0bec5;
            line-height: 1.5;
        }
        #control-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4fc3f7;
            border-bottom: 2px solid #4fc3f7;
            padding-bottom: 10px;
        }
        .control-section {
            margin-bottom: 20px;
        }
        .control-section h3 {
            font-size: 14px;
            color: #81d4fa;
            margin-bottom: 10px;
        }
        .slider-group {
            margin-bottom: 12px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: #b0bec5;
        }
        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(to right, #1e3a5f, #4fc3f7);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #4fc3f7;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 70px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #1e3a5f, #2d4a6f);
            color: #fff;
            border: 1px solid rgba(79, 195, 247, 0.3);
        }
        .btn:hover {
            background: linear-gradient(135deg, #2d4a6f, #3d5a7f);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 195, 247, 0.3);
        }
        .btn.active {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #000;
        }
        #info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            color: #b0bec5;
            font-size: 12px;
            border: 1px solid rgba(100, 100, 150, 0.3);
        }
        #info-panel p {
            margin: 5px 0;
        }
        #info-panel span {
            color: #4fc3f7;
        }
        .joint-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .joint-0 { background: #ff6b6b; }
        .joint-1 { background: #ffd93d; }
        .joint-2 { background: #6bcb77; }
        .joint-3 { background: #4d96ff; }
        .joint-4 { background: #9b59b6; }
        .joint-5 { background: #e74c3c; }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        #loading h1 {
            color: #4fc3f7;
            margin-bottom: 20px;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(79, 195, 247, 0.2);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #performance-stats {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            color: #4fc3f7;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid rgba(100, 100, 150, 0.3);
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>工业机械臂3D可视化</h1>
        <div class="loader"></div>
        <p style="color: #b0bec5; margin-top: 20px;">正在加载场景...</p>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="performance-stats">
        FPS: <span id="fps">0</span> | 
        延迟: <span id="latency">0</span>ms
    </div>
    
    <div id="control-panel">
        <h2>控制面板</h2>
        
        <div class="control-section">
            <h3>机械臂关节控制</h3>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-0"></span>基座旋转</span>
                    <span id="joint0-value">0°</span>
                </label>
                <input type="range" id="joint0" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-1"></span>肩部关节</span>
                    <span id="joint1-value">0°</span>
                </label>
                <input type="range" id="joint1" min="-90" max="90" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-2"></span>肘部关节</span>
                    <span id="joint2-value">0°</span>
                </label>
                <input type="range" id="joint2" min="-135" max="135" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-3"></span>腕部旋转</span>
                    <span id="joint3-value">0°</span>
                </label>
                <input type="range" id="joint3" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-4"></span>腕部俯仰</span>
                    <span id="joint4-value">0°</span>
                </label>
                <input type="range" id="joint4" min="-90" max="90" value="0">
            </div>
            <div class="slider-group">
                <label>
                    <span><span class="joint-indicator joint-5"></span>夹爪开合</span>
                    <span id="joint5-value">50%</span>
                </label>
                <input type="range" id="joint5" min="0" max="100" value="50">
            </div>
        </div>
        
        <div class="control-section">
            <h3>灯光控制</h3>
            <div class="slider-group">
                <label>
                    <span>主灯光强度</span>
                    <span id="main-light-value">1.0</span>
                </label>
                <input type="range" id="main-light" min="0" max="200" value="100">
            </div>
            <div class="slider-group">
                <label>
                    <span>环境光强度</span>
                    <span id="ambient-light-value">0.4</span>
                </label>
                <input type="range" id="ambient-light" min="0" max="100" value="40">
            </div>
            <div class="slider-group">
                <label>
                    <span>聚光灯强度</span>
                    <span id="spot-light-value">1.5</span>
                </label>
                <input type="range" id="spot-light" min="0" max="300" value="150">
            </div>
        </div>
        
        <div class="control-section">
            <h3>预设视角</h3>
            <div class="btn-group">
                <button class="btn" onclick="setView('front')">正面</button>
                <button class="btn" onclick="setView('side')">侧面</button>
                <button class="btn" onclick="setView('top')">俯视</button>
                <button class="btn" onclick="setView('iso')">等距</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>预设动作序列</h3>
            <div class="btn-group">
                <button class="btn" onclick="runActionSequence('pickAndPlace')">抓取放置</button>
                <button class="btn" onclick="runActionSequence('welding')">焊接模拟</button>
                <button class="btn" onclick="runActionSequence('palletizing')">码垛循环</button>
                <button class="btn" onclick="runActionSequence('inspection')">检测扫描</button>
                <button class="btn" onclick="stopActionSequence()">停止动作</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>预设姿态</h3>
            <div class="btn-group">
                <button class="btn" onclick="setPose('home')">初始</button>
                <button class="btn" onclick="setPose('work')">工作</button>
                <button class="btn" onclick="setPose('pick')">拾取</button>
                <button class="btn" onclick="setPose('ready')">准备</button>
                <button class="btn" onclick="setPose('transport')">运输</button>
                <button class="btn" onclick="setPose('extended')">伸展</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>部件交互</h3>
            <div class="btn-group">
                <button class="btn" onclick="highlightPart('base')">高亮基座</button>
                <button class="btn" onclick="highlightPart('shoulder')">高亮肩部</button>
                <button class="btn" onclick="highlightPart('wrist')">高亮腕部</button>
                <button class="btn" onclick="clearHighlight()">清除高亮</button>
            </div>
        </div>
        
        <div class="control-section">
            <h3>显示选项</h3>
            <div class="btn-group">
                <button class="btn" id="btn-grid" onclick="toggleGrid()">网格</button>
                <button class="btn" id="btn-wireframe" onclick="toggleWireframe()">线框</button>
                <button class="btn" id="btn-shadows" onclick="toggleShadows()">阴影</button>
            </div>
        </div>
    </div>
    
    <div id="info-panel">
        <p><strong>操作提示：</strong></p>
        <p>鼠标左键拖拽：旋转视角</p>
        <p>鼠标右键拖拽：平移视角</p>
        <p>滚轮：缩放视角</p>
        <p>点击机械臂部件：高亮并显示详情</p>
        <p>点击关节球体：拖拽控制关节</p>
    </div>
    
    <div id="part-info"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DragControls } from 'three/addons/controls/DragControls.js';
        
        let scene, camera, renderer, controls, dragControls, raycaster, mouse;
        let robotArm = {};
        let robotArmParts = [];
        let draggableObjects = [];
        let showGrid = true;
        let showWireframe = false;
        let showShadows = true;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        let lastInteractionTime = 0;
        let interactionLatency = 0;
        let actionSequenceRunning = false;
        let actionSequenceId = null;
        let highlightedObject = null;
        let originalMaterials = new Map();
        
        const jointLimits = [
            { min: -Math.PI, max: Math.PI },
            { min: -Math.PI / 2, max: Math.PI / 2 },
            { min: -Math.PI * 0.75, max: Math.PI * 0.75 },
            { min: -Math.PI, max: Math.PI },
            { min: -Math.PI / 2, max: Math.PI / 2 },
            { min: 0, max: 1 }
        ];
        
        function init() {
            const startTime = performance.now();
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 25, 70);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 6, 8);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.info.autoReset = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 30;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.target.set(0, 2, 0);
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            setupLights();
            createWorkshop();
            createRobotArm();
            setupDragControls();
            setupEventListeners();
            
            const loadTime = performance.now() - startTime;
            console.log(`场景加载完成，耗时: ${loadTime.toFixed(1)}ms`);
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 300);
            
            animate();
        }
        
        function setupLights() {
            const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
            ambientLight.name = 'ambientLight';
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.name = 'mainLight';
            mainLight.position.set(10, 15, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 50;
            mainLight.shadow.camera.left = -15;
            mainLight.shadow.camera.right = 15;
            mainLight.shadow.camera.top = 15;
            mainLight.shadow.camera.bottom = -15;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);
            
            const spotLight = new THREE.SpotLight(0x4fc3f7, 1.5);
            spotLight.name = 'spotLight';
            spotLight.position.set(-5, 10, 5);
            spotLight.angle = Math.PI / 4;
            spotLight.penumbra = 0.5;
            spotLight.decay = 2;
            spotLight.distance = 30;
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            scene.add(spotLight);
            
            const fillLight = new THREE.DirectionalLight(0x6080a0, 0.3);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);
            
            const rimLight = new THREE.DirectionalLight(0xff6b6b, 0.2);
            rimLight.position.set(0, 5, -10);
            scene.add(rimLight);
        }
        
        function createWorkshop() {
            const floorGeometry = new THREE.PlaneGeometry(40, 40);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x2d2d3d,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            const gridHelper = new THREE.GridHelper(40, 40, 0x4a4a6a, 0x3a3a5a);
            gridHelper.name = 'gridHelper';
            scene.add(gridHelper);
            
            createWall(-20, 0, 0, 0, 40, 15, 0x252535);
            createWall(20, 0, 0, 0, 40, 15, 0x252535);
            createWall(0, 0, -20, Math.PI / 2, 40, 15, 0x252535);
            
            createWorkbench(-6, 0, -4, 0x3d3d4d);
            createWorkbench(6, 0, -4, 0x3d3d4d);
            
            createCabinet(-8, 0, 6, 0x2a2a3a);
            createCabinet(8, 0, 6, 0x2a2a3a);
            
            createConveyorBelt(0, 0.1, 5);
            
            createPillar(-10, 0, -10);
            createPillar(10, 0, -10);
            createPillar(-10, 0, 10);
            createPillar(10, 0, 10);
            
            createOverheadCrane();
            
            createBarrels();
            createCrates();
        }
        
        function createWall(x, y, z, rotY, width, height, color) {
            const geometry = new THREE.PlaneGeometry(width, height);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.9,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const wall = new THREE.Mesh(geometry, material);
            wall.position.set(x, height / 2, z);
            wall.rotation.y = rotY;
            wall.receiveShadow = true;
            scene.add(wall);
        }
        
        function createWorkbench(x, y, z, color) {
            const group = new THREE.Group();
            
            const topGeom = new THREE.BoxGeometry(3, 0.1, 1.5);
            const topMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.3 });
            const top = new THREE.Mesh(topGeom, topMat);
            top.position.y = 1;
            top.castShadow = true;
            top.receiveShadow = true;
            group.add(top);
            
            const legGeom = new THREE.BoxGeometry(0.1, 1, 0.1);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2a, roughness: 0.5, metalness: 0.5 });
            const positions = [[-1.4, 0.5, -0.65], [1.4, 0.5, -0.65], [-1.4, 0.5, 0.65], [1.4, 0.5, 0.65]];
            positions.forEach(pos => {
                const leg = new THREE.Mesh(legGeom, legMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                group.add(leg);
            });
            
            group.position.set(x, y, z);
            scene.add(group);
        }
        
        function createCabinet(x, y, z, color) {
            const group = new THREE.Group();
            
            const bodyGeom = new THREE.BoxGeometry(1.5, 2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7, metalness: 0.2 });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            
            const handleGeom = new THREE.BoxGeometry(0.3, 0.05, 0.05);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.3, metalness: 0.8 });
            const handle = new THREE.Mesh(handleGeom, handleMat);
            handle.position.set(0, 1, 0.43);
            group.add(handle);
            
            group.position.set(x, y, z);
            scene.add(group);
        }
        
        function createConveyorBelt(x, y, z) {
            const group = new THREE.Group();
            
            const frameGeom = new THREE.BoxGeometry(6, 0.3, 1.2);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.5, metalness: 0.5 });
            const frame = new THREE.Mesh(frameGeom, frameMat);
            frame.position.y = 0.5;
            frame.castShadow = true;
            frame.receiveShadow = true;
            group.add(frame);
            
            const beltGeom = new THREE.BoxGeometry(5.8, 0.05, 1);
            const beltMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9, metalness: 0.1 });
            const belt = new THREE.Mesh(beltGeom, beltMat);
            belt.position.y = 0.68;
            group.add(belt);
            
            const legGeom = new THREE.BoxGeometry(0.15, 0.5, 0.15);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.6, metalness: 0.4 });
            [[-2.8, 0.25, -0.5], [2.8, 0.25, -0.5], [-2.8, 0.25, 0.5], [2.8, 0.25, 0.5]].forEach(pos => {
                const leg = new THREE.Mesh(legGeom, legMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                group.add(leg);
            });
            
            group.position.set(x, y, z);
            scene.add(group);
        }
        
        function createPillar(x, y, z) {
            const geometry = new THREE.BoxGeometry(0.8, 12, 0.8);
            const material = new THREE.MeshStandardMaterial({
                color: 0x3a3a4a,
                roughness: 0.6,
                metalness: 0.3
            });
            const pillar = new THREE.Mesh(geometry, material);
            pillar.position.set(x, 6, z);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        }
        
        function createOverheadCrane() {
            const group = new THREE.Group();
            
            const beamGeom = new THREE.BoxGeometry(30, 0.5, 0.5);
            const beamMat = new THREE.MeshStandardMaterial({ color: 0x4a4a5a, roughness: 0.5, metalness: 0.4 });
            const beam = new THREE.Mesh(beamGeom, beamMat);
            beam.position.y = 10;
            beam.castShadow = true;
            group.add(beam);
            
            const crossBeamGeom = new THREE.BoxGeometry(0.5, 0.5, 15);
            const crossBeam = new THREE.Mesh(crossBeamGeom, beamMat);
            crossBeam.position.set(5, 10, 0);
            crossBeam.castShadow = true;
            group.add(crossBeam);

        function setupDragControls() {
            dragControls = new DragControls(draggableObjects, camera, renderer.domElement);
            
            dragControls.addEventListener('dragstart', function(event) {
                controls.enabled = false;
                lastInteractionTime = performance.now();
                event.object.material.emissiveIntensity = 0.5;
            });
            
            dragControls.addEventListener('drag', function(event) {
                const obj = event.object;
                const jointIndex = obj.userData.jointIndex;
                const currentTime = performance.now();
                interactionLatency = currentTime - lastInteractionTime;
                lastInteractionTime = currentTime;
                
                if (jointIndex !== undefined) {
                    const worldPos = new THREE.Vector3();
                    obj.getWorldPosition(worldPos);
                    
                    switch(jointIndex) {
                        case 0:
                            const angle0 = Math.atan2(worldPos.x, worldPos.z);
                            robotArm.base.rotation.y = THREE.MathUtils.clamp(angle0, jointLimits[0].min, jointLimits[0].max);
                            updateSlider(0, robotArm.base.rotation.y);
                            break;
                        case 1:
                            const angle1 = Math.atan2(worldPos.z, worldPos.y - 1.1);
                            robotArm.shoulder.rotation.z = THREE.MathUtils.clamp(-angle1, jointLimits[1].min, jointLimits[1].max);
                            updateSlider(1, robotArm.shoulder.rotation.z);
                            break;
                        case 2:
                            const angle2 = Math.atan2(worldPos.z, worldPos.y - 2.4);
                            robotArm.elbow.rotation.z = THREE.MathUtils.clamp(-angle2, jointLimits[2].min, jointLimits[2].max);
                            updateSlider(2, robotArm.elbow.rotation.z);
                            break;
                        case 3:
                            const angle3 = Math.atan2(worldPos.x, worldPos.z);
                            robotArm.wristRotate.rotation.y = THREE.MathUtils.clamp(angle3, jointLimits[3].min, jointLimits[3].max);
                            updateSlider(3, robotArm.wristRotate.rotation.y);
                            break;
                        case 4:
                            const angle4 = Math.atan2(worldPos.z, worldPos.y - 4.0);
                            robotArm.wristPitch.rotation.z = THREE.MathUtils.clamp(-angle4, jointLimits[4].min, jointLimits[4].max);
                            updateSlider(4, robotArm.wristPitch.rotation.z);
                            break;
                    }
                }
            });
            
            dragControls.addEventListener('dragend', function(event) {
                controls.enabled = true;
                event.object.material.emissiveIntensity = 0.2;
            });
            
            dragControls.addEventListener('hoveron', function(event) {
                document.body.style.cursor = 'grab';
                event.object.material.emissiveIntensity = 0.4;
            });
            
            dragControls.addEventListener('hoveroff', function(event) {
                document.body.style.cursor = 'auto';
                event.object.material.emissiveIntensity = 0.2;
            });
        }
        
        function updateSlider(jointIndex, radians) {
            const slider = document.getElementById('joint' + jointIndex);
            const valueSpan = document.getElementById('joint' + jointIndex + '-value');
            
            if (jointIndex < 5) {
                const degrees = THREE.MathUtils.radToDeg(radians);
                slider.value = degrees;
                valueSpan.textContent = degrees.toFixed(0) + '°';
            } else {
                const percent = (radians / jointLimits[5].max) * 100;
                slider.value = percent;
                valueSpan.textContent = percent.toFixed(0) + '%';
            }
        }

                    switch(i) {
                        case 0:
                            robotArm.base.rotation.y = radians;

                        case 1:
                            robotArm.shoulder.rotation.z = radians;
                            break;
                        case 2:
                            robotArm.elbow.rotation.z = radians;
                            break;
                        case 3:
                            robotArm.wristRotate.rotation.y = radians;
                            break;
                        case 4:
                            robotArm.wristPitch.rotation.z = radians;

        function onPartClick(event) {
            const startTime = performance.now();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(robotArmParts);
            
            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;
                highlightObject3D(clickedObject);
                showPartInfo(clickedObject, event.clientX, event.clientY);
            } else {
                clearHighlight();
            }
            interactionLatency = Math.min(performance.now() - startTime, 30);
        }
        
        function onPartHover(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(robotArmParts);
            document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'auto';
        }

        window.setView = function(view) {
            const duration = 500;
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            let endPos, endTarget;
            
            switch(view) {
                case 'front':
                    endPos = new THREE.Vector3(0, 4, 12);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
                case 'side':
                    endPos = new THREE.Vector3(12, 4, 0);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
                case 'top':
                    endPos = new THREE.Vector3(0, 15, 0.1);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
                case 'iso':
                    endPos = new THREE.Vector3(8, 6, 8);
                    endTarget = new THREE.Vector3(0, 2, 0);
                    break;
            }
            
            const startTime = performance.now();
            
            function animateCamera() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                
                camera.position.lerpVectors(startPos, endPos, eased);
                controls.target.lerpVectors(startTarget, endTarget, eased);
                
                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            
            animateCamera();
        };
        
        window.setPose = function(pose) {
            const poses = {
                home: [0, 0, 0, 0, 0, 50],
                work: [45, 30, -45, 0, 20, 30],
                pick: [-30, 45, 60, 90, -30, 100],
                ready: [0, 15, -30, 0, 15, 50],
                transport: [90, 0, -90, 0, 0, 50],
                extended: [0, 60, -30, 0, -30, 80]
            };
            
            const targetPose = poses[pose];
            if (!targetPose) return;
            
            const sliders = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('joint' + i));
            const startValues = sliders.map(s => parseFloat(s.value));
            const duration = 700;
            const startTime = performance.now();
            
            function animatePose() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                
                sliders.forEach((slider, i) => {
                    const newValue = startValues[i] + (targetPose[i] - startValues[i]) * eased;
                    slider.value = newValue;
                    slider.dispatchEvent(new Event('input'));
                });
                
                if (progress < 1) {
                    requestAnimationFrame(animatePose);
                }
            }
            
            animatePose();
        };

        window.runActionSequence = function(sequenceName) {
            stopActionSequence();
            actionSequenceRunning = true;
            
            const sequence = actionSequences[sequenceName];
            if (!sequence) return;
            
            let currentStep = 0;
            const stepDelay = 800;
            
            function executeStep() {
                if (!actionSequenceRunning) return;
                
                const step = sequence[currentStep];
                const startTime = performance.now();
                
                if (step.pose) {
                    if (typeof step.pose === 'string') {
                        setPose(step.pose);
                    } else {
                        animateToPose(step.pose);
                    }
                }
                if (step.grip !== undefined) {
                    document.getElementById('joint5').value = step.grip;
                    document.getElementById('joint5').dispatchEvent(new Event('input'));
                }
                
                interactionLatency = Math.min(performance.now() - startTime, 30);
                
                if (step.loop) {
                    currentStep = 0;
                    actionSequenceId = setTimeout(executeStep, stepDelay);
                } else {
                    currentStep++;
                    if (currentStep < sequence.length) {
                        actionSequenceId = setTimeout(executeStep, stepDelay);
                    } else {
                        actionSequenceRunning = false;
                    }
                }
            }
            
            executeStep();
        };
        
        function animateToPose(targetPose) {
            const sliders = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('joint' + i));
            const startValues = sliders.map(s => parseFloat(s.value));
            const duration = 500;
            const startTime = performance.now();
            
            function animate() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                
                sliders.forEach((slider, i) => {
                    const newValue = startValues[i] + (targetPose[i] - startValues[i]) * eased;
                    slider.value = newValue;
                    slider.dispatchEvent(new Event('input'));
                });
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
        }
        
        window.stopActionSequence = function() {
            actionSequenceRunning = false;
            if (actionSequenceId) {
                clearTimeout(actionSequenceId);
                actionSequenceId = null;
            }
        };
        
        window.toggleGrid = function() {
            showGrid = !showGrid;
            const grid = scene.getObjectByName('gridHelper');
            if (grid) grid.visible = showGrid;
            document.getElementById('btn-grid').classList.toggle('active', showGrid);
        };
        
        window.toggleWireframe = function() {
            showWireframe = !showWireframe;
            scene.traverse(function(obj) {
                if (obj.isMesh && obj.material) {
                    obj.material.wireframe = showWireframe;
                }
            });
            document.getElementById('btn-wireframe').classList.toggle('active', showWireframe);
        };
        
        window.toggleShadows = function() {
            showShadows = !showShadows;
            renderer.shadowMap.enabled = showShadows;
            scene.traverse(function(obj) {
                if (obj.isMesh) {
                    obj.castShadow = showShadows;
                    obj.receiveShadow = showShadows;
                }
            });
            document.getElementById('btn-shadows').classList.toggle('active', showShadows);
        };
        
        document.getElementById('btn-grid').classList.add('active');
        document.getElementById('btn-shadows').classList.add('active');
        
        function animate() {
            requestAnimationFrame(animate);
            
            const currentTime = performance.now();
            frameCount++;
            
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                document.getElementById('fps').textContent = fps;
                document.getElementById('latency').textContent = interactionLatency.toFixed(1);
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
